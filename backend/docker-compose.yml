version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tpvra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tpvra_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tpvra-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tpvra_db?schema=public
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-MrVKi58Y7OURY2l0Echqyi+g80KYM9Ieb63d/710W4I=}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3001}
      PORT: 3001
      # Add other environment variables as needed
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Mount source for hot reload in development
      - ./src:/app/src
      - ./prisma:/app/prisma
    command: sh -c "bunx prisma migrate deploy && bun run --watch src/index.ts"

volumes:
  postgres_data:
    driver: local
